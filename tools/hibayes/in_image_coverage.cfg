# task-3R3 — coverage.py config for the IN-IMAGE HiBayes-eval coverage gate.
#
# The global pyproject.toml [tool.coverage.run].omit excludes the eval axis
# tree so the HOST `uv run pytest` gate is not dragged down by axis modules
# that cannot run on host (DD-13 split-coverage). The in-image gate needs the
# OPPOSITE: it exists precisely to measure the axes at >=95%. This config is
# passed via `--cov-config` on the in-image pytest invocation and
# intentionally omits nothing in the axis tree.
[run]
branch = false

[report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
omit =
    */__pycache__/*
