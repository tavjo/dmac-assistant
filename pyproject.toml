[project]
name = "dmac-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.116",
    "httpx>=0.28.1",
    # Plan A · Amendment 7 v2 to T7 (2026-04-30): markitdown[all] moved to the
    # sibling `build_tools/` uv project (its own pyproject + venv + lockfile).
    # The bridge runtime + image have zero markitdown imports; only
    # `build_tools/ingest_nextseek_docs/fetch.py` uses it, and that script runs
    # on the host (`make ingest-nextseek-docs`) to generate `container/CLAUDE.md`
    # + `docs/nextseek/` artifacts which are COPYd into the image as static
    # files. Splitting into a separate project keeps this lockfile portable
    # (no onnxruntime cp314-vs-darwin-x86_64 wheel matrix issue) and keeps the
    # image small. See plan body Amendment Log § "Amendment 7 v2".
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

# Amendment 6 ([tool.uv] environments scope) was REVERTED by Amendment 7.
# The bridge lockfile is now portable across all uv-supported platforms
# because markitdown (and its onnxruntime tail) lives in the sibling
# build_tools/ project, not in the bridge dep tree.

# Coverage scope notes: --cov=build_tools is intentionally REMOVED from the
# bridge addopts below. build_tools moved to a sibling uv project with its
# own coverage gate; running `pytest` here covers only the bridge.

[tool.pytest.ini_options]
addopts = "--disable-socket -q --cov=tests.harness --cov=src/dmac_assistant --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks live end-to-end tests requiring ~/.env (deselect with '-m \"not live\"')",
    "live_bridge: marks live FastAPI bridge end-to-end tests requiring Docker + ~/.env (deselect with '-m \"not live_bridge\"')",
    "live_docker: marks opt-in Docker-backed tests that do not require live service credentials",
    "slow: marks slower local Docker build tests",
]

# T7 path-decision: PATH_B image-only — chat_nextseek install deferred to T8 (R4-NEW-5)
