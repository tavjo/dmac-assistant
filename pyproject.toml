[project]
name = "dmac-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.116",
    "httpx>=0.28.1",
    "markitdown[all]>=0.1.5",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "--disable-socket -q --cov=build_tools --cov=tests.harness --cov=src/dmac_assistant --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks live end-to-end tests requiring ~/.env (deselect with '-m \"not live\"')",
    "live_bridge: marks live FastAPI bridge end-to-end tests requiring Docker + ~/.env (deselect with '-m \"not live_bridge\"')",
    "live_docker: marks opt-in Docker-backed tests that do not require live service credentials",
    "slow: marks slower local Docker build tests",
]
